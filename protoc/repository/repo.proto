syntax = "proto3";

package repository;

option go_package = "github.com/dositadi/cheffery/repository";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

message CreateUserRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message CreateUserResponse {
    string id = 1;
    google.protobuf.Timestamp createdAt = 2;
}

message DeleteUserRequest {
    string id = 1;
}

message DeleteUserResponse {}

message GetUserByIDRequest {
    string userID = 1;
}

message GetUserByIDResponse {
    string id = 1;
    string name = 2;
    string email = 3;
    int32 version = 5;
    google.protobuf.Timestamp createdAt = 6;
    google.protobuf.Timestamp updatedAt = 7;
}

message GetUserByEmailRequest {
    string email = 1;
}

message GetUserByEmailResponse {
    string id = 1;
    string name = 2;
    string email = 3;
    int32 version = 5;
    google.protobuf.Timestamp createdAt = 6;
    google.protobuf.Timestamp updatedAt = 7;
}

message UpdateUserRequest {
    string name = 1;
    string email = 2;
    string newPassword = 3;
    string oldPassword = 4;
    string id = 5;
}

message UpdateUserResponse {
    bool datachanged = 1;
    repeated string fields = 2;
    google.protobuf.Timestamp timestamp = 3; 
}

message DBHealthRequest {}

message DBHealthResponse {
    string status = 1;
    DBHealth dbHealth = 2;
    google.protobuf.Duration latency = 3;
    google.protobuf.Timestamp timestamp = 4;
}

message DBHealth {
    bool connected = 1;
    bool poolHealthy = 2;
    int32 totalConns = 3;
    int32 idleConns = 4;
    int32 acquiredConns = 5;
    int32 acquiredCount = 6;
    int32 createdCount = 7;
    int32 releasedCount = 8;
    int32 destroyedCount = 9;
    string message = 10; 
}

service Repository {
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
    rpc GetUserByID (GetUserByIDRequest) returns (GetUserByIDResponse);
    rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
    rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
    rpc DBHealth(DBHealthRequest) returns (DBHealthResponse);
    rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
}