version: "2"
sql:
  - engine: "postgresql"
    schema: "services/repository/internal/migrations/"
    queries: "services/repository/internal/store/query/"
    gen:
      go:
        package: "sqlc"
        out: "services/repository/internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
